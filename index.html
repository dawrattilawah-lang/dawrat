<script>

async function searchStudent(){

const phone =
document.getElementById("phone").value;

const url =
"https://script.google.com/macros/s/AKfycbzO1Ih5hYrCjBRTMaq-T6zuTs2gaCZm6WCdNteJzkruK5ysKG5pyAd4o6pj_KCA_IRapQ/exec?phone="
+ phone;

const response = await fetch(url);

const data = await response.json();

let html = "";

if(data.length === 0){

html = `
<div class="not-found">
لا توجد نتيجة لهذا الرقم
</div>
`;

}else{

data.forEach(item=>{

html += `

<div class="card">

<div class="badge">
${item.level}
</div>

<div class="row">
<span class="label">اسم الطالبة:</span>
${item.name}
</div>

<div class="row">
<span class="label">المستوى:</span>
${item.level}
</div>

<div class="row">
<span class="label">وقت المجموعة:</span>
${item.groupTime}
</div>

<div class="row">
<span class="label">اسم المعلمة:</span>
${item.teacher}
</div>

<hr>

<div class="row">
<span class="label">الالتزام بالحضور:</span>
${item.attendance}
</div>

<div class="row">
<span class="label">أخطاء التشكيل:</span>
${item.tashkeel}
</div>

<div class="row">
<span class="label">أحكام النون الساكنة:</span>
${item.noon}
</div>

<div class="row">
<span class="label">أحكام الميم الساكنة:</span>
${item.meem}
</div>

<div class="row">
<span class="label">مخارج الحروف:</span>
${item.makharij}
</div>

<div class="row">
<span class="label">باب المدود:</span>
${item.madd}
</div>

<div class="row">
<span class="label">باب الوقف والابتداء:</span>
${item.waqf}
</div>

</div>

`;

});

}

document.getElementById("results").innerHTML = html;

}

</script>
