<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>البحث</title>
</head>

<body>

<h2>بحث الطالبة</h2>

<input type="text" id="phone" placeholder="رقم الهاتف">

<button onclick="searchStudent()">
بحث
</button>

<div id="results"></div>

<script>

console.log("JS loaded");

async function searchStudent(){

try{

const phone =
document.getElementById("phone").value.trim();

if(phone === ""){
alert("يرجى إدخال رقم الهاتف");
return;
}

const url =
"https://script.google.com/macros/s/AKfycbzO1Ih5hYrCjBRTMaq-T6zuTs2gaCZm6WCdNteJzkruK5ysKG5pyAd4o6pj_KCA_IRapQ/exec?phone="
+ encodeURIComponent(phone);

const response = await fetch(url);

const text = await response.text();

console.log(text);

const data = JSON.parse(text);

let html = "";

if(data.length === 0){

html = "لا توجد نتيجة";

}else{

data.forEach(item=>{

html += `
<div>
<p>${item.name}</p>
<p>${item.level}</p>
</div>
`;

});

}

document.getElementById("results").innerHTML = html;

}catch(error){

console.log(error);

document.getElementById("results").innerHTML =
"حدث خطأ";

}

}

</script>

</body>
</html>
