<script>

async function searchStudent(){

try{

const phone =
document.getElementById("phone").value.trim();

if(phone === ""){
alert("يرجى إدخال رقم الهاتف");
return;
}

const url =
"https://script.google.com/macros/s/AKfycbzO1Ih5hYrCjBRTMaq-T6zuTs2gaCZm6WCdNteJzkruK5ysKG5pyAd4o6pj_KCA_IRapQ/exec?phone="
+ encodeURIComponent(phone);

const response = await fetch(url);

const text = await response.text();
const data = JSON.parse(text);

let html = "";

if(data.length === 0){

html = `
<div class="not-found">
لا توجد نتيجة لهذا الرقم
</div>
`;

}else{

data.forEach(item=>{

html += `
<div class="card">

<div class="badge">${item.level}</div>

<div class="row"><span class="label">اسم الطالبة:</span> ${item.name}</div>
<div class="row"><span class="label">المستوى:</span> ${item.level}</div>
<div class="row"><span class="label">وقت المجموعة:</span> ${item.groupTime}</div>
<div class="row"><span class="label">اسم المعلمة:</span> ${item.teacher}</div>

<hr>

<div class="row"><span class="label">الحضور:</span> ${item.attendance}</div>
<div class="row"><span class="label">التشكيل:</span> ${item.tashkeel}</div>
<div class="row"><span class="label">النون الساكنة:</span> ${item.noon}</div>
<div class="row"><span class="label">الميم الساكنة:</span> ${item.meem}</div>
<div class="row"><span class="label">المخارج:</span> ${item.makharij}</div>
<div class="row"><span class="label">المدود:</span> ${item.madd}</div>
<div class="row"><span class="label">الوقف:</span> ${item.waqf}</div>

</div>
`;
});

}

document.getElementById("results").innerHTML = html;

}catch(error){

console.log(error);

document.getElementById("results").innerHTML = `
<div class="not-found">
حدث خطأ أثناء جلب البيانات
</div>
`;

}

}

</script>
