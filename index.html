<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة متابعة الطالبة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Cairo', sans-serif;

background:
linear-gradient(
135deg,
#f5f7fa,
#edf1f7
);

min-height:100vh;

padding:40px 20px;

color:#111827;

}

.container{

max-width:850px;

margin:auto;

}

.header{

text-align:center;

margin-bottom:40px;

}

.header h1{

font-size:48px;

font-weight:800;

color:#0f172a;

margin-bottom:10px;

}

.header p{

font-size:18px;

color:#475569;

}

.search-box{

background:white;

padding:25px;

border-radius:24px;

box-shadow:
0 10px 30px rgba(15,23,42,0.08);

display:flex;

gap:15px;

margin-bottom:30px;

border:1px solid #e2e8f0;

}

.search-box input{

flex:1;

padding:18px;

border-radius:16px;

border:2px solid #dbe4f0;

font-size:18px;

font-family:'Cairo', sans-serif;

outline:none;

transition:0.3s;

background:#f8fafc;

}

.search-box input:focus{

border-color:#1d4ed8;

background:white;

box-shadow:
0 0 0 5px rgba(37,99,235,0.1);

}

.search-box button{

padding:18px 35px;

border:none;

border-radius:16px;

background:
linear-gradient(
135deg,
#1e3a8a,
#2563eb
);

color:white;

font-size:18px;

font-weight:700;

font-family:'Cairo', sans-serif;

cursor:pointer;

transition:0.3s;

box-shadow:
0 8px 20px rgba(37,99,235,0.25);

}

.search-box button:hover{

transform:translateY(-2px);

box-shadow:
0 12px 25px rgba(37,99,235,0.35);

}

.card{

background:white;

padding:35px;

border-radius:28px;

box-shadow:
0 15px 40px rgba(15,23,42,0.08);

margin-top:25px;

border:1px solid #e5e7eb;

position:relative;

overflow:hidden;

}

.card::before{

content:"";

position:absolute;

top:0;

right:0;

width:100%;

height:6px;

background:
linear-gradient(
90deg,
#1e3a8a,
#2563eb,
#0f172a
);

}

.student-name{

font-size:34px;

font-weight:800;

color:#0f172a;

margin-bottom:10px;

}

.level-badge{

display:inline-block;

padding:8px 18px;

background:#dbeafe;

color:#1d4ed8;

border-radius:999px;

font-size:15px;

font-weight:700;

margin-bottom:25px;

}

.section-title{

font-size:22px;

font-weight:700;

margin-bottom:20px;

color:#1e3a8a;

}

.info-grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));

gap:18px;

}

.info-item{

background:#f8fafc;

padding:18px;

border-radius:18px;

border:1px solid #e2e8f0;

}

.label{

display:block;

font-size:14px;

color:#64748b;

margin-bottom:8px;

font-weight:600;

}

.value{

font-size:18px;

font-weight:700;

color:#0f172a;

line-height:1.8;

}

.not-found{

background:white;

padding:30px;

border-radius:24px;

text-align:center;

font-size:22px;

font-weight:700;

color:#dc2626;

box-shadow:
0 10px 30px rgba(0,0,0,0.06);

}

@media(max-width:700px){

.header h1{

font-size:34px;

}

.search-box{

flex-direction:column;

}

.search-box button{

width:100%;

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>لوحة متابعة الطالبة</h1>

<p>
منصة متابعة مستويات الطالبات والتقييم
</p>

</div>

<div class="search-box">

<input
type="text"
id="phone"
placeholder="أدخلي رقم الهاتف">

<button onclick="searchStudent()">
بحث
</button>

</div>

<div id="results"></div>

</div>

<script>

async function searchStudent(){

try{

const phone =
document.getElementById("phone").value.trim();

if(phone === ""){

alert("يرجى إدخال رقم الهاتف");

return;

}

const url =
"https://script.google.com/macros/s/AKfycbzO1Ih5hYrCjBRTMaq-T6zuTs2gaCZm6WCdNteJzkruK5ysKG5pyAd4o6pj_KCA_IRapQ/exec?phone="
+ encodeURIComponent(phone);

const response = await fetch(url);

const text = await response.text();

const data = JSON.parse(text);

let html = "";

if(data.length === 0){

html = `

<div class="not-found">

لا توجد نتائج لهذا الرقم

</div>

`;

}else{

data.forEach(item => {

html += `
<div class="section-title">
معلومات الطالبة
</div>

<div class="info-grid">
<div class="card">

<div class="student-name">
${item.name}
</div>

<div class="level-badge">
${item.level}
</div>



<div class="info-item">
<span class="label">وقت المجموعة</span>
<div class="value">${item.groupTime}</div>
</div>

<div class="info-item">
<span class="label">المعلمة</span>
<div class="value">${item.teacher}</div>
</div>

<div class="info-item">
<span class="label">مستوى الالتزام بالحضور
</span>
<div class="value">${item.attendance}</div>
</div>

<div class="info-item">
<span class="label">أخطاء التشكيل والحركات
</span>
<div class="value">${item.tashkeel}</div>
</div>

<div class="info-item">
<span class="label">أحكام النون الساكنة والتنوين
</span>
<div class="value">${item.noon}</div>
</div>

<div class="info-item">
<span class="label">أحكام الميم الساكنة
</span>
<div class="value">${item.meem}</div>
</div>

<div class="info-item">
<span class="label">مخارج الحروف والصفات
</span>
<div class="value">${item.makharij}</div>
</div>

<div class="info-item">
<span class="label">باب المدود
</span>
<div class="value">${item.madd}</div>
</div>

<div class="info-item">
<span class="label"> باب الوقف والابتداء
</span>
<div class="value">${item.waqf}</div>
</div>

</div>

</div>

`;

});

}

document.getElementById("results").innerHTML = html;

}catch(error){

console.log(error);

document.getElementById("results").innerHTML = `

<div class="not-found">

حدث خطأ أثناء جلب البيانات

</div>

`;

}

}

</script>

</body>

</html>
